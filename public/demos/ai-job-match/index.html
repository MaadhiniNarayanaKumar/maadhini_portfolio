<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job match preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14110e;
        color: #e7e5e4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .wrap {
        box-sizing: border-box;
        height: 100%;
        overflow: auto;
        padding: 14px;
      }

      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a8a29e;
      }

      label.wide {
        grid-column: 1 / -1;
      }

      textarea,
      input {
        box-sizing: border-box;
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(251, 191, 36, 0.25);
        background: #0c0a09;
        color: #fafaf9;
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        padding: 8px 10px;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
        border: 1px solid rgba(251, 191, 36, 0.45);
        background: rgba(251, 191, 36, 0.14);
        color: #fbbf24;
      }

      button.secondary {
        background: transparent;
        color: #d6d3d1;
        border-color: rgba(168, 162, 158, 0.4);
      }

      #result {
        margin-top: 12px;
      }

      #result:empty {
        display: none;
      }

      .decision {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .decision strong {
        font-size: 18px;
        letter-spacing: 0.04em;
      }

      .scores {
        display: flex;
        gap: 16px;
        font-size: 13px;
        color: #d6d3d1;
        margin-bottom: 10px;
      }

      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .col h3 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a8a29e;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid rgba(168, 162, 158, 0.35);
        color: #e7e5e4;
      }

      .empty {
        font-size: 12px;
        color: #a8a29e;
      }

      @media (max-width: 640px) {
        form,
        .cols {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <form id="form">
        <label>
          Resume text
          <textarea id="resume" name="resume">Python developer with 4 years of experience. Built APIs with FastAPI and Flask. Daily work in SQL, Docker, and AWS. Comfortable with git and React.</textarea>
        </label>
        <label>
          Job page text
          <textarea id="job" name="job">We need a Python engineer who knows FastAPI, PostgreSQL, Docker, and AWS. React is a plus. Kubernetes experience is required.</textarea>
        </label>
        <label class="wide">
          Extra skills, comma separated
          <input id="extra" name="extra" value="postgresql" />
        </label>
        <div class="actions">
          <button type="submit">Match</button>
          <button type="button" id="clear" class="secondary">Clear</button>
        </div>
      </form>
      <div id="result"></div>
    </div>
    <script>
      const SKILLS = [
        "python", "java", "javascript", "typescript", "csharp", "c#", "cpp", "c++", "ruby", "php", "swift", "kotlin",
        "golang", "rust", "scala", "matlab", "perl",
        "react", "vue", "angular", "django", "flask", "fastapi", "express", "nextjs", "next.js", "laravel", "rails",
        "spring", "asp.net", "dotnet", ".net",
        "sql", "mysql", "postgresql", "mongodb", "firebase", "redis", "elasticsearch", "cassandra", "dynamodb",
        "aws", "azure", "gcp", "docker", "kubernetes", "jenkins", "gitlab", "github", "terraform", "ansible",
        "pandas", "numpy", "scikit-learn", "tensorflow", "pytorch", "keras", "spark", "hadoop",
        "leadership", "communication", "teamwork", "problem solving", "project management", "agile", "scrum",
        "ui design", "ux design", "graphic design", "content writing", "copywriting",
        "git", "rest api", "graphql", "microservices", "nosql", "html", "css", "scss", "sass",
        "webpack", "npm", "yarn", "linux", "unix", "windows", "macos", "deployment", "ci/cd"
      ];

      function extractSkills(text) {
        const lower = text.toLowerCase();
        const found = [];
        for (const skill of SKILLS) {
          const pattern = new RegExp("\\b" + skill.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b");
          if (pattern.test(lower)) found.push(skill);
        }
        return found.sort();
      }

      function matchJob(resumeText, pageText, userSkills) {
        const candidate = Array.from(new Set(extractSkills(resumeText).concat(extractSkills(userSkills.join(" ")))));
        const jobSkills = extractSkills(pageText);
        const matched = jobSkills.filter((skill) => candidate.includes(skill)).sort();
        const missing = jobSkills.filter((skill) => !candidate.includes(skill)).sort();
        let decision = "DO NOT APPLY";
        let color = "#f87171";
        let confidence = "low";
        let note = "";
        let score = 0;
        if (!jobSkills.length) {
          decision = "MAYBE APPLY";
          color = "#fb923c";
          note = "No skills from the list were found in the posting.";
        } else {
          score = Math.round((matched.length / jobSkills.length) * 100);
          if (score >= 70) {
            decision = "APPLY";
            color = "#4ade80";
            confidence = "high";
          } else if (score >= 50) {
            decision = "MAYBE APPLY";
            color = "#fb923c";
            confidence = "medium";
          }
        }
        return { decision, color, confidence, score, matched, missing, note };
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[ch]));
      }

      function chips(items) {
        if (!items.length) return '<span class="empty">None</span>';
        return '<div class="chips">' + items.map((item) => '<span class="chip">' + escapeHtml(item) + "</span>").join("") + "</div>";
      }

      function render(result) {
        document.getElementById("result").innerHTML =
          '<div class="decision"><strong style="color:' + result.color + '">' + result.decision + "</strong>" +
          '<span>' + result.confidence + " confidence</span></div>" +
          '<div class="scores"><span>Posting covered: ' + result.score + "%</span></div>" +
          (result.note ? '<p class="empty">' + escapeHtml(result.note) + "</p>" : "") +
          '<div class="cols"><div class="col"><h3>In both</h3>' + chips(result.matched) + "</div>" +
          '<div class="col"><h3>Posting skills missing from the resume</h3>' + chips(result.missing) + "</div></div>";
      }

      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const extra = document.getElementById("extra").value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        render(matchJob(
          document.getElementById("resume").value,
          document.getElementById("job").value,
          extra,
        ));
      });

      document.getElementById("clear").addEventListener("click", () => {
        document.getElementById("form").reset();
        document.getElementById("resume").value = "";
        document.getElementById("job").value = "";
        document.getElementById("extra").value = "";
        document.getElementById("result").innerHTML = "";
      });

      document.getElementById("form").requestSubmit();
    </script>
  </body>
</html>
