<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mia Calendar</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f0fa;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --label: #9ca3af;
        --primary: #4f46e5;
        --primary-soft: #818cf8;
        --tint: #eef2ff;
        --border: #e5e7eb;
        --guess: #f59e0b;
        --guess-bg: #fef3c7;
        --radius: 8px;
        --shadow: 0 -8px 24px rgba(17, 24, 39, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #111827;
          --card: #1f2937;
          --text: #f9fafb;
          --muted: #9ca3af;
          --label: #9ca3af;
          --primary: #818cf8;
          --primary-soft: #a5b4fc;
          --tint: #1e1b4b;
          --border: #374151;
          --guess: #fbbf24;
          --guess-bg: #422006;
          --shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .stage { height: 100%; min-height: 100%; display: flex; }
      .shell {
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }
      .header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
      .brand { display: flex; gap: 10px; align-items: center; }
      .logo { width: 36px; height: 36px; border-radius: 10px; }
      h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      .steps { list-style: none; display: flex; gap: 12px; margin: 4px 0 0; padding: 0; font-size: 12px; font-weight: 600; color: var(--label); }
      .steps li { position: relative; padding-left: 11px; }
      .steps li::before { content: ""; position: absolute; left: 0; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
      .steps li.active { color: var(--primary); }
      .steps li.active::before { background: var(--primary); }
      .steps li.done { color: var(--muted); }
      .steps li.done::before { background: var(--primary-soft); }
      .scroll { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .footer { padding: 12px 16px 16px; background: var(--card); border-top: 1px solid var(--border); box-shadow: var(--shadow); }
      .field-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 650; color: var(--label); }
      .form { display: flex; flex-direction: column; gap: 12px; }
      input, textarea, select {
        width: 100%; font: inherit; font-size: 14px; font-weight: 500; color: var(--text);
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; outline: none;
      }
      input[type="date"], input[type="time"], input[type="text"], select { height: 38px; }
      input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
      .guessed { border-color: var(--guess) !important; background: color-mix(in srgb, var(--guess-bg) 55%, var(--card)); }
      .title-area { resize: vertical; min-height: 40px; }
      #notes, #paste { resize: vertical; min-height: 72px; }
      .btn { border: 0; border-radius: var(--radius); padding: 10px 14px; width: 100%; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff; }
      .paste-collapsed[hidden], #pasteBlock[hidden] { display: none; }
      .paste-collapsed {
        display: flex; justify-content: space-between; width: 100%; border: 1px dashed var(--border);
        background: var(--tint); color: var(--text); border-radius: var(--radius); padding: 5px 8px; font-size: 11px; font-weight: 600; cursor: pointer;
      }
      .paste-collapsed span { color: var(--muted); font-weight: 500; }
      .when-row, .split-row { display: flex; gap: 8px; align-items: flex-end; }
      .grow { flex: 1; min-width: 0; }
      .reminder-field { width: 96px; }
      .allday-toggle { display: flex; align-items: center; gap: 6px; margin-bottom: 1px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; }
      .allday-toggle input { width: 30px; height: 18px; appearance: none; border-radius: 999px; background: var(--border); border: 0; position: relative; padding: 0; cursor: pointer; }
      .allday-toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
      .allday-toggle input:checked { background: var(--primary); }
      .allday-toggle input:checked::after { transform: translateX(12px); }
      .times { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
      .times.hidden { display: none; }
      .duration { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--tint); border-radius: 999px; padding: 3px 6px; margin-bottom: 3px; white-space: nowrap; }
      .select-wrap { position: relative; display: flex; align-items: center; }
      .dot { position: absolute; left: 8px; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }
      .select-wrap select { padding-left: 20px; }
      .status { margin: 0 0 4px; font-size: 11px; font-weight: 600; text-align: center; }
      .status.ok { color: #16a34a; }
      .status.err { color: #dc2626; }
      .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
      .caption { margin: 10px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="shell">
        <header class="header">
          <div class="brand">
            <img class="logo" src="icon.png" alt="" />
            <div>
              <h1>Mia Calendar</h1>
              <ol class="steps" id="steps">
                <li data-step="1">Paste</li>
                <li data-step="2">Review</li>
                <li data-step="3">Send</li>
              </ol>
            </div>
          </div>
        </header>
        <div class="scroll">
          <section id="pasteBlock">
            <label class="field-label" for="paste">Paste invite</label>
            <textarea id="paste" rows="3" placeholder="LSEG Presentation · Thu Oct 8, 2:00–3:00pm · Room 608"></textarea>
          </section>
          <button type="button" class="paste-collapsed" id="pasteCollapsed" hidden>Pasted invite <span>(tap to edit)</span></button>
          <form id="form" class="form">
            <div class="field">
              <label class="field-label" for="title">Title</label>
              <textarea id="title" class="title-area" rows="1" required placeholder="Meeting title"></textarea>
            </div>
            <div class="field">
              <label class="field-label" for="calendar">Calendar</label>
              <div class="select-wrap">
                <span class="dot" id="calendarDot" style="background:#7c3aed"></span>
                <select id="calendar">
                  <option value="manual" data-color="#4F46E5">Personal</option>
                  <option value="work" data-color="#7C3AED" selected>Work</option>
                  <option value="extension" data-color="#818CF8">Extension</option>
                </select>
              </div>
            </div>
            <div class="when-row">
              <div class="field grow">
                <label class="field-label" for="date">Date</label>
                <input id="date" type="date" required />
              </div>
              <label class="allday-toggle"><span>All day</span><input id="allDay" type="checkbox" role="switch" /></label>
            </div>
            <div class="times" id="timesRow">
              <div class="field">
                <label class="field-label" for="startTime">Starts</label>
                <input id="startTime" type="time" required />
              </div>
              <div class="duration" id="duration">1 hr</div>
              <div class="field">
                <label class="field-label" for="endTime">Ends</label>
                <input id="endTime" type="time" required />
              </div>
            </div>
            <div class="split-row">
              <div class="field grow">
                <label class="field-label" for="location">Location</label>
                <input id="location" type="text" placeholder="Room, Zoom, address…" />
              </div>
              <div class="field reminder-field">
                <label class="field-label" for="reminder">Reminder</label>
                <select id="reminder">
                  <option value="">None</option>
                  <option value="10">10 min</option>
                  <option value="60">1 hr</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="notes">Notes</label>
              <textarea id="notes" rows="1" placeholder="Description / organizer…"></textarea>
            </div>
          </form>
        </div>
        <footer class="footer">
          <p id="status" class="status" hidden></p>
          <button id="submit" type="submit" form="form" class="btn">Send to Mia</button>
          <p class="caption">Preview only. Nothing is written to Firestore.</p>
        </footer>
      </div>
    </div>
    <div id="toast" class="toast" hidden>Saved in this preview</div>
    <script>
      const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
      const pasteEl = document.querySelector("#paste");
      const pasteBlock = document.querySelector("#pasteBlock");
      const pasteCollapsed = document.querySelector("#pasteCollapsed");
      const titleEl = document.querySelector("#title");
      const dateEl = document.querySelector("#date");
      const startTimeEl = document.querySelector("#startTime");
      const endTimeEl = document.querySelector("#endTime");
      const timesRow = document.querySelector("#timesRow");
      const durationEl = document.querySelector("#duration");
      const allDayEl = document.querySelector("#allDay");
      const locationEl = document.querySelector("#location");
      const notesEl = document.querySelector("#notes");
      const calendarEl = document.querySelector("#calendar");
      const calendarDot = document.querySelector("#calendarDot");
      const statusEl = document.querySelector("#status");
      const toastEl = document.querySelector("#toast");
      const steps = [...document.querySelectorAll("#steps li")];
      let durationMs = 60 * 60 * 1000;

      function toDateValue(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }
      function toTimeValue(date) {
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }
      function combine(dateValue, timeValue, allDay) {
        const [y, m, d] = dateValue.split("-").map(Number);
        if (allDay) return new Date(y, m - 1, d, 0, 0, 0, 0);
        const [hh, mm] = (timeValue || "00:00").split(":").map(Number);
        return new Date(y, m - 1, d, hh, mm, 0, 0);
      }
      function applyAmPm(hour, ap) {
        if (ap === "pm" && hour < 12) return hour + 12;
        if (ap === "am" && hour === 12) return 0;
        return hour;
      }
      function isJunkTitle(title) {
        const t = (title || "").trim();
        if (!t) return true;
        if (/calendar\s*[-–—]\s*week of/i.test(t)) return true;
        if (/university\s*[-–—]\s*calendar/i.test(t)) return true;
        if (/^google calendar$/i.test(t)) return true;
        return /week of\s+(january|february|march|april|may|june|july|august|september|october|november|december)/i.test(t);
      }
      function parseWhen(match) {
        const day = Number(match[3]);
        const month = MONTHS.indexOf(match[2].toLowerCase()) + 1;
        const now = new Date();
        let year = now.getFullYear();
        const hasTime = !!match[4];
        let hour = 9;
        let minute = 0;
        if (hasTime) {
          hour = applyAmPm(Number(match[4]), (match[6] || match[9] || "").toLowerCase());
          minute = Number(match[5]);
        }
        let start = new Date(year, month - 1, day, hour, minute, 0, 0);
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if (start < todayStart) start = new Date(year + 1, month - 1, day, hour, minute, 0, 0);
        let end;
        if (match[7]) {
          const eh = applyAmPm(Number(match[7]), (match[9] || match[6] || "").toLowerCase());
          end = new Date(start.getFullYear(), start.getMonth(), start.getDate(), eh, Number(match[8]), 0, 0);
          if (end <= start) end = new Date(end.getTime() + 86400000);
        } else {
          end = new Date(start.getTime() + 3600000);
        }
        return { start, end, hasTime };
      }
      function parseInviteText(raw) {
        const text = (raw || "").trim();
        if (!text) return null;
        const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        let title = "";
        let start = null;
        let end = null;
        let location = "";
        const notes = [];
        const guessed = new Set();
        const whenRe = /(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})(?:[,.\s⋅·•]*)?(?:(\d{1,2}):(\d{2})\s*(am|pm)?\s*[–—\-]\s*(\d{1,2}):(\d{2})\s*(am|pm)?)?/i;
        const meetUrlRe = /https?:\/\/[^\s]*(zoom\.us|meet\.google\.com|teams\.microsoft\.com|webex\.com)[^\s]*/i;
        for (const line of lines) {
          if (/^\d+\s+guests?/i.test(line) || /^\d+\s+(yes|awaiting|no|maybe)\b/i.test(line) || /minutes?\s+before/i.test(line)) continue;
          const when = line.match(whenRe);
          if (when && !start) {
            const parsed = parseWhen(when);
            start = parsed.start;
            end = parsed.end;
            guessed.add("start");
            guessed.add("end");
            continue;
          }
          const meet = line.match(meetUrlRe) || line.match(/https?:\/\/[^\s]+/i);
          if (meet && !location) { location = meet[0]; guessed.add("location"); continue; }
          if ((/^(room|rm\.?|bldg\.?|building|suite|floor)\b[\s.:].+/i.test(line) || /^\d{1,5}\s+[A-Za-z0-9].+(?:,|\s)[A-Z]{2}\b/.test(line)) && !location) {
            location = line; guessed.add("location"); continue;
          }
          if (/^(created by|organizer)\s*:/i.test(line)) { notes.push(line); continue; }
          if (!title) {
            if (isJunkTitle(line)) continue;
            title = line; guessed.add("title"); continue;
          }
          if (!isJunkTitle(line)) notes.push(line);
        }
        if (!title) { title = "New event"; guessed.add("title"); }
        if (!start) {
          start = new Date();
          start.setMinutes(0, 0, 0);
          start.setHours(start.getHours() + 1);
          end = new Date(start.getTime() + 3600000);
          guessed.add("start");
          guessed.add("end");
        }
        if (!end || end <= start) end = new Date(start.getTime() + 3600000);
        return { title, start, end, location, notes: notes.join("\n"), guessed: [...guessed] };
      }
      function formatDuration(ms) {
        const mins = Math.round(ms / 60000);
        if (mins < 60) return `${mins} min`;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m === 0 ? (h === 1 ? "1 hr" : `${h} hr`) : `${h}h ${m}m`;
      }
      function currentStart() { return combine(dateEl.value, startTimeEl.value, allDayEl.checked); }
      function currentEnd() {
        if (allDayEl.checked) {
          const start = currentStart();
          return new Date(start.getFullYear(), start.getMonth(), start.getDate(), 23, 59, 0, 0);
        }
        return combine(dateEl.value, endTimeEl.value, false);
      }
      function updateDuration() {
        durationMs = Math.max(0, currentEnd() - currentStart());
        durationEl.textContent = formatDuration(durationMs || 3600000);
      }
      function syncAllDay() {
        timesRow.classList.toggle("hidden", allDayEl.checked);
        updateDuration();
      }
      function setDateTimes(start, end) {
        dateEl.value = toDateValue(start);
        startTimeEl.value = toTimeValue(start);
        endTimeEl.value = toTimeValue(end);
        durationMs = Math.max(end - start, 15 * 60 * 1000);
        updateDuration();
      }
      function setStep(n) {
        steps.forEach((li) => {
          const step = Number(li.dataset.step);
          li.classList.toggle("active", step === n);
          li.classList.toggle("done", step < n);
        });
      }
      function setStatus(message, ok) {
        statusEl.hidden = !message;
        statusEl.textContent = message || "";
        statusEl.className = `status ${ok ? "ok" : "err"}`;
      }
      function markGuessed(names) {
        [titleEl, dateEl, startTimeEl, endTimeEl, locationEl, notesEl].forEach((el) => el.classList.remove("guessed"));
        if (names.includes("title")) titleEl.classList.add("guessed");
        if (names.includes("start")) { dateEl.classList.add("guessed"); startTimeEl.classList.add("guessed"); }
        if (names.includes("end")) endTimeEl.classList.add("guessed");
        if (names.includes("location")) locationEl.classList.add("guessed");
        if (names.includes("notes")) notesEl.classList.add("guessed");
      }
      function applyParsed(parsed) {
        if (!parsed) { setStatus("Couldn’t parse that invite text", false); return; }
        titleEl.value = parsed.title || "";
        setDateTimes(parsed.start, parsed.end);
        locationEl.value = parsed.location || "";
        notesEl.value = parsed.notes || "";
        markGuessed(parsed.guessed);
        syncAllDay();
        pasteBlock.hidden = true;
        pasteCollapsed.hidden = false;
        setStatus("Review highlighted fields, then Send", true);
        setStep(2);
      }
      calendarEl.addEventListener("change", () => {
        calendarDot.style.background = calendarEl.selectedOptions[0].dataset.color;
        setStep(2);
      });
      allDayEl.addEventListener("change", syncAllDay);
      startTimeEl.addEventListener("change", () => {
        const end = new Date(currentStart().getTime() + (durationMs || 3600000));
        endTimeEl.value = toTimeValue(end);
        updateDuration();
      });
      endTimeEl.addEventListener("change", updateDuration);
      pasteEl.addEventListener("input", () => {
        if (pasteEl.value.trim().length > 12) applyParsed(parseInviteText(pasteEl.value));
      });
      pasteCollapsed.addEventListener("click", () => {
        pasteBlock.hidden = false;
        pasteCollapsed.hidden = true;
        setStep(1);
        pasteEl.focus();
      });
      document.querySelector("#form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!titleEl.value.trim()) return;
        setStep(3);
        setStatus("Saved in this preview", true);
        toastEl.hidden = false;
        setTimeout(() => { toastEl.hidden = true; setStep(2); }, 1200);
      });
      pasteEl.value = "LSEG Presentation\nThursday, November 12, 2:00–3:00pm\nRoom 608";
      applyParsed(parseInviteText(pasteEl.value));
    </script>
  </body>
</html>
